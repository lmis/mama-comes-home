<meta charset="utf-8">
<title>Mama Comes Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika&family=Fredoka:wght@500;700&display=swap">
<style>
  /* One picture book lying on a dark wooden table: the page fills the width,
     with the keys underneath like a row of chunky keycaps. */
  :root {
    --table: #2b1c22;
    --table-2: #3b2730;
    --paper: #fffaf0;
    --ink: #46282f;
    --cap: #f6eedd;
    --cap-edge: #c9b79c;
    --glow: #ffd27a;
    --pink: #ffa3c4; --pink-edge: #d4678f;
    --blue: #96d4ff; --blue-edge: #4f9bd2;
    --green: #a4e294; --green-edge: #5ea752;
    --display: "Fredoka", "Baloo 2", system-ui, sans-serif;
    --body: "Andika", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--table-2), var(--table) 70%);
    color: var(--paper);
    font-family: var(--body);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .book {
    position: relative;
    width: min(100%, calc((100vh - 210px) * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px 14px 14px 6px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 2px 0 6px #5a3a44, 0 2px 0 9px #2a181e;
  }
  #page { display: block; width: 100%; height: 100%; border-radius: inherit; outline: none; cursor: pointer; touch-action: manipulation; }
  #page:focus-visible { box-shadow: 0 0 0 4px var(--glow); }
  .keys { display: flex; align-items: center; justify-content: center; gap: 28px; max-width: 100%; }
  .acts { display: grid; grid-template-columns: repeat(3, auto); gap: 12px 16px; }
  .keys button { border: 0; cursor: pointer; display: grid; place-items: center; padding: 0; flex-shrink: 0; }
  .keys .acts { min-width: 0; }
  .keys .act { width: 92px; height: 44px; border-radius: 14px; background: var(--c); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 65%, #46282f); }
  .keys .turn { width: 64px; height: 64px; border-radius: 50%; background: var(--cap); color: var(--ink); box-shadow: 0 5px 0 var(--cap-edge), 0 8px 14px rgba(0,0,0,0.35); }
  .keys .turn svg { width: 30px; height: 30px; }
  .keys .act.pic { width: 132px; height: 74px; background-size: cover; background-position: center; border: 4px solid var(--c); }
  .keys button:disabled { opacity: 0.3; cursor: default; transform: none; }
  .keys button:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
  #pages { position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer;
    background: rgba(42,24,30,0.7); color: var(--paper); border: 2px solid rgba(255,250,240,0.45); }
  #pages svg { width: 22px; height: 22px; }
  #loupe { position: fixed; z-index: 6; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: grab; touch-action: none;
    background: rgba(42,24,30,0.7); color: var(--paper); border: 2px solid rgba(255,250,240,0.45); }
  #loupe svg { width: 24px; height: 24px; }
  #loupe:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
  body.loupe-on #loupe { opacity: 0.55; border-style: dashed; } /* the spot to drop it back */
  #lens { position: fixed; z-index: 7; display: none; touch-action: none; cursor: grab; width: 190px; height: 190px; border-radius: 50%;
    border: 6px solid #f6eedd; box-shadow: 0 0 0 3px #46282f, 0 12px 30px rgba(0,0,0,0.5); background: #2a1a22; }
  body.loupe-on #lens { display: block; }
  body.loupe-drag #lens { cursor: grabbing; }
  @media (max-height: 500px), (max-width: 520px) { #lens { width: 140px; height: 140px; } }
  #pages:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
  #menu { border: 0; border-radius: 22px; padding: 18px 20px 22px; width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: #3a2430; color: var(--paper); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  #menu::backdrop { background: rgba(20,10,16,0.6); }
  .menu-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .menu-head h2 { margin: 0; font-size: 26px; font-weight: 700; }
  .menu-close { border: 0; background: var(--cap); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .menu-grid button { border: 3px solid transparent; border-radius: 14px; padding: 0 0 8px; background: rgba(255,250,240,0.08); color: var(--paper); cursor: pointer; font: inherit; font-size: 15px; text-align: center; overflow: hidden; }
  .menu-grid button[aria-current="page"] { border-color: var(--glow); }
  .menu-grid button:hover, .menu-grid button:focus-visible { border-color: var(--paper); outline: none; }
  .menu-grid canvas { display: block; width: 100%; aspect-ratio: 16 / 9; margin-bottom: 6px; background: #2a1a22; }
  .menu-grid b { color: var(--glow); margin-right: 4px; }
  @media (max-width: 520px) { .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
  #mute { width: 46px; height: 46px; border-radius: 50%; background: transparent; color: var(--paper); border: 2px solid rgba(255,250,240,0.35); box-shadow: none; margin-left: -6px; }
  #mute svg { width: 24px; height: 24px; }
  #mute .cross { display: none; }
  #mute[aria-pressed="true"] .cross { display: inline; }
  #mute[aria-pressed="true"] .waves { display: none; }
  @media (max-width: 640px) {
    .keys { gap: 12px; }
    .acts { gap: 8px 10px; }
    .keys .act { width: 60px; height: 34px; border-radius: 10px; }
    .keys .act.pic { width: 80px; height: 45px; border-width: 3px; }
    .keys .turn { width: 46px; height: 46px; }
    .keys .turn svg { width: 22px; height: 22px; }
    #mute { width: 36px; height: 36px; }
  }
  @media (max-width: 520px) { /* phones upright: the picture buttons get their own row, page turns and sound below */
    .keys { flex-wrap: wrap; gap: 14px 28px; }
    .acts { order: -1; flex-basis: 100%; justify-content: center; }
    .keys .act.pic { width: 100px; height: 56px; }
    .keys .act { width: 100px; height: 40px; }
    .keys .turn { width: 56px; height: 56px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body { flex-direction: row; gap: 10px; padding-block: 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
    .book { width: min(calc(100vw - 170px), calc((100vh - 12px) * 16 / 9)); }
    .keys { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 6px; justify-items: center; align-items: center; }
    .acts { grid-column: 1 / -1; order: -1; grid-template-columns: repeat(2, auto); gap: 6px; }
    .keys .act.pic { width: 70px; height: 40px; border-width: 3px; }
    .keys .act { width: 70px; height: 30px; }
    .keys .turn { width: 42px; height: 42px; }
    .keys .turn svg { width: 20px; height: 20px; }
    #mute { margin-left: 0; width: 34px; height: 34px; }
    #pages, #loupe { width: 36px; height: 36px; top: 6px; }
    #pages svg, #loupe svg { width: 18px; height: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .keys button { transition: none; } }
</style>
